name: Reboot Hub Used DJI Drone Price Data - Q3 2026 Analysis Resource
description: >-
  An openly licensed higher-education data resource for examining listed-price
  ranges, bundle effects, evidence boundaries, and reproducible market-data
  analysis. The public package contains 43 DJI aircraft model-level aggregates
  summarizing 251 published Reboot Hub catalog configurations, together with a
  documented CSV schema and an executed analysis notebook. Listed prices are
  not transaction prices or market-wide valuations, and the resource states
  that limitation explicitly.
